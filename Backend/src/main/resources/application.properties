spring.application.name=hugitbackend
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/huGit}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#Jwt
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000

#AI
# GEMINI CHAT
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL}
# GEMINI EMBEDDINGS
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING}

# pg-vector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=3072
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

#GithubOAuth2 Configurations
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope[0]=read:user
spring.security.oauth2.client.registration.github.scope[1]=repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

#HuggingFace
spring.security.oauth2.client.registration.huggingface.client-id=${HUGGING_FACE_CLIENT_ID}
spring.security.oauth2.client.registration.huggingface.client-secret=${HUGGING_FACE_CLIENT_SECRET}
spring.security.oauth2.client.registration.huggingface.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.huggingface.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.huggingface.scope[0]=profile
spring.security.oauth2.client.registration.huggingface.scope[1]=email
spring.security.oauth2.client.registration.huggingface.scope[2]=read-repos
spring.security.oauth2.client.registration.huggingface.scope[3]=gated-repos
spring.security.oauth2.client.provider.huggingface.user-name-attribute=name
spring.security.oauth2.client.provider.huggingface.authorization-uri=https://huggingface.co/oauth/authorize
spring.security.oauth2.client.provider.huggingface.token-uri=https://huggingface.co/oauth/token
spring.security.oauth2.client.provider.huggingface.user-info-uri=https://huggingface.co/api/whoami-v2
#Cookies,CORS
server.servlet.session.cookie.name=HUGIT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

#Frontend settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:huGit-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.api-delay-ms=50

logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.web.client.RestTemplate=TRACE
logging.level.org.springframework.http.client.support.HttpAccessor=TRACE






